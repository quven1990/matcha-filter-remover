# Push to main → build → Cloudflare Pages deploy.
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Create at https://dash.cloudflare.com/profile/api-tokens → Create Token → Custom token
# Permissions:
#   Account → Cloudflare Pages → Edit
#   Account → Account Settings → Read
#   User → User Details → Read
#
# Account ID is set below (same Cloudflare account as other sites).

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-matcha-filter-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
        run: npx wrangler pages deploy out --project-name matcha-filter --branch main
